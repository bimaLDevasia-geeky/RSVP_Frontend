
<H1>Events</H1>
@if(readEvents().length>0){
    @for (event of readEvents(); track $index) {
        <div class="event-card">
            <h2>{{event.description}}</h2>
            <p>{{event.isPublic ? 'Public' : 'Private'}}</p>
            <p>{{event.status}}</p>
            <p>{{event.venue}}</p>
            <p>{{event.description}}</p>
            <p><strong>Date:</strong> {{event.date | date}} | <strong>Time:</strong> {{event.time | timeonly}}</p>
        </div>
    }
}
